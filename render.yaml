services:
  - type: web
    name: onyx-weather-backend
    env: python
    region: singapore # Change as needed
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # Set securely in Render dashboard
      - key: FRONTEND_ORIGINS
        value: "*" # Change in Render dashboard if needed for production
      - key: ADMIN_API_KEY
        sync: false # Set securely in Render dashboard
